  /* Desfoque gaussiano da logomarca depois do scroll: 25% de um raio máximo de 40px. Para mais ou menos desfoque, mude aqui. */
  --logo-blur:10px;
  --p:0; /* progresso do scroll: 0 = tela de início, 1 = painel */
  --folha:rgba(7,18,12,.74); --folha-2:rgba(7,18,12,.86); --solido:#08140E;
  --tinta:#F3FBF6; --tinta-2:rgba(243,251,246,.7); --linha:rgba(255,255,255,.14);
  --marca:#4ade80; --marca-tinta:#03170B; --realce:rgba(255,255,255,.08); --ouro:#86efac;
  --atraso:#FF9A8C; --atraso-fundo:rgba(190,40,30,.32); --alarme:#C4332A;
  --hoje:#F5C261; --hoje-fundo:rgba(245,194,97,.16);
  --pago:#86efac; --pago-fundo:rgba(74,222,128,.14);
  --zap:#4ade80;
  --sombra:0 24px 60px -30px rgba(0,0,0,.9);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* modo alerta: existe pagamento em atraso, o sistema inteiro muda para vermelho (o wallpaper também) */
:root[data-alerta="1"]{
  --folha:rgba(24,8,7,.76); --folha-2:rgba(24,8,7,.88); --solido:#170807; --linha:rgba(255,205,200,.18);
  --marca:#FF8E7F; --marca-tinta:#2A0906; --ouro:#fca5a5;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-snap-type:y proximity;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:#000;color:var(--tinta);
  font-family:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums lining-nums;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--marca);outline-offset:2px}
h1,h2,h3,p{margin:0}
img{max-width:100%}
.so-leitor{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* fundo: wallpaper fluido, véu escuro e logomarca fixa */
#fundo{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;background:radial-gradient(120% 90% at 30% 20%,#059669 0%,#04301f 45%,#000 100%)}
:root[data-alerta="1"] #fundo{background:radial-gradient(120% 90% at 30% 20%,#b91c1c 0%,#3a0a0a 45%,#000 100%)}
.escuro{position:fixed;inset:0;z-index:0;background:#000;opacity:calc(.22 + var(--p) * .43);pointer-events:none}
.marca{
  position:fixed;inset:0;z-index:0;display:grid;place-items:center;pointer-events:none;
  filter:blur(calc(var(--p) * var(--logo-blur)));opacity:calc(1 - var(--p) * .82);transform:scale(calc(1 + var(--p) * .05));
}
@property --raio{syntax:"<percentage>";inherits:false;initial-value:170%}
.marca__img{
  width:min(80vw,860px);aspect-ratio:1870/539;background:var(--logo) center/contain no-repeat;
  -webkit-mask-image:radial-gradient(circle at 5% 14%,#000 var(--raio),transparent calc(var(--raio) + 24%));
  mask-image:radial-gradient(circle at 5% 14%,#000 var(--raio),transparent calc(var(--raio) + 24%));
  animation:surgir 2.4s cubic-bezier(.2,.7,.1,1) .3s both;
}
@keyframes surgir{
  0%{--raio:0%;opacity:0;filter:blur(24px) drop-shadow(0 8px 40px rgba(0,0,0,.5));transform:translateY(16px) scale(1.05)}
  25%{opacity:1}
  100%{--raio:170%;opacity:1;filter:blur(0) drop-shadow(0 8px 40px rgba(0,0,0,.5));transform:none}
}
#intro{
  position:relative;z-index:1;height:100vh;height:100svh;display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:max(22px,env(safe-area-inset-bottom,0px));scroll-snap-align:start;cursor:pointer;
}
.descer{background:none;border:0;padding:14px 26px;opacity:0;animation:aparecer .8s ease 2.8s forwards}
.descer i{display:block;width:1px;height:48px;margin:0 auto;background:linear-gradient(#fff,rgba(255,255,255,0));transform-origin:top;animation:descer 2.2s ease-in-out 2.8s infinite}
@keyframes aparecer{to{opacity:1}}
@keyframes descer{0%{transform:scaleY(0)}45%{transform:scaleY(1)}100%{transform:translateY(22px) scaleY(1);opacity:0}}

/* estrutura */
#app{position:relative;z-index:1;display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh;scroll-snap-align:start}
.trilho{
  position:sticky;top:0;align-self:start;height:100vh;padding:30px 20px 24px;
  background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
  color:var(--tinta);border-right:1px solid var(--linha);display:flex;flex-direction:column;gap:30px;
}
.logo{display:block;width:100%;max-width:196px;aspect-ratio:1870/539;background:var(--logo) left center/contain no-repeat}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{
  display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;
  background:none;border:0;border-left:2px solid transparent;border-radius:0 8px 8px 0;padding:11px 14px;font-weight:500;color:var(--tinta-2);
}
.nav button:hover{color:var(--tinta)}
.nav button[aria-current="page"]{background:var(--realce);border-left-color:var(--ouro);color:var(--tinta);font-weight:600}
.conta{
  min-width:22px;padding:0 6px;border-radius:11px;background:#fff;color:#8C1A15;
  font-size:13px;font-weight:700;text-align:center;line-height:22px;
}
.trilho .pe{margin-top:auto;font-size:13px;color:var(--tinta-2);overflow-wrap:anywhere}
.conteudo{padding:38px clamp(16px,4vw,52px) 96px;max-width:1200px;width:100%}
.abas{display:none}

.topo{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:24px}
.topo h1{font-weight:600;font-size:clamp(32px,4.6vw,52px);line-height:1.02;letter-spacing:-.035em}
.topo .sub{color:var(--tinta-2);margin-top:8px}
.topo h2{font-weight:600;font-size:26px;line-height:1.1;letter-spacing:-.025em}
.grupo-botoes{display:flex;flex-wrap:wrap;gap:8px}

.bt{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 16px;
  border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);font-weight:600;text-decoration:none;
  color:var(--tinta);white-space:nowrap;transition:background-color .2s,border-color .2s;
}
.bt:hover{background:rgba(255,255,255,.17);border-color:rgba(255,255,255,.34)}
.bt--marca{background:var(--marca);border-color:var(--marca);color:var(--marca-tinta)}
.bt--marca:hover{background:var(--marca);border-color:var(--marca);filter:brightness(1.1)}
.bt--zap{border-color:var(--zap);color:var(--zap)}
.bt--zap:hover{background:var(--pago-fundo);border-color:var(--zap)}
.bt--cobrar{background:var(--alarme);border-color:var(--alarme);color:#fff}
.bt--cobrar:hover{background:var(--alarme);border-color:var(--alarme);filter:brightness(1.12)}
.bt--perigo{color:var(--atraso)}
.bt--perigo:hover{border-color:var(--atraso)}
.bt--p{min-height:34px;padding:5px 12px;font-size:14px}
.bt[disabled]{opacity:.5;cursor:not-allowed}

/* alarme de atraso */
.alarme{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:var(--alarme);color:#fff;
  border-radius:14px;padding:14px 18px;margin-bottom:26px;box-shadow:var(--sombra);
}
.alarme__txt{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:600;flex:1 1 260px}
.pisca{flex:none;width:11px;height:11px;border-radius:50%;background:#fff;animation:pisca 1.5s ease-in-out infinite}
@keyframes pisca{50%{opacity:.25;transform:scale(.7)}}
.alarme__nomes{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 100%}
.alarme__nomes button{
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:15px;
  padding:3px 12px;font-size:14px;font-weight:600;
}
.alarme__nomes button:hover{background:rgba(255,255,255,.28)}
.alarme .bt{background:#fff;border-color:#fff;color:#8C1A15}

/* superfícies de vidro */
.razao,.tabela,.cartao,.grafico-caixa,.portal__cx{
  background:var(--folha);border:1px solid var(--linha);border-radius:14px;box-shadow:var(--sombra);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
}

/* razão: totais */
.razao{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:0 0 30px}
.razao div{padding:16px 20px;border-left:1px solid var(--linha)}
.razao div:first-child{border-left:0}
.razao dt{font-size:14px;color:var(--tinta-2)}
.razao dd{margin:4px 0 0;font-weight:600;font-size:clamp(20px,2.3vw,27px);line-height:1.15;letter-spacing:-.02em}
.razao dd small{display:block;font-size:13px;font-weight:500;color:var(--tinta-2);letter-spacing:0}
.razao .em-atraso dd{color:var(--atraso)}
.razao .recebido dd{color:var(--pago)}

/* cobranças */
.grupo{margin-bottom:30px}
.grupo>h2{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;font-size:21px;font-weight:600;letter-spacing:-.02em;margin-bottom:10px}
.grupo>h2 small{font-size:14px;font-weight:500;color:var(--tinta-2);letter-spacing:0}
.grupo--atraso>h2{color:var(--atraso)}
.grupo--hoje>h2{color:var(--hoje)}
.cob{
  display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto auto;align-items:center;gap:8px 16px;
  background:var(--folha-2);border:1px solid var(--linha);border-left:4px solid rgba(255,255,255,.22);
  border-radius:12px;padding:13px 16px;margin-bottom:8px;
}
.cob--atraso{border-color:var(--atraso);border-left-width:6px;background:linear-gradient(var(--atraso-fundo),var(--atraso-fundo)),var(--solido)}
.cob--hoje{border-left-color:var(--hoje);background:linear-gradient(var(--hoje-fundo),var(--hoje-fundo)),var(--solido)}
.cob__quem{background:none;border:0;padding:0;text-align:left;min-width:0}
.cob__quem strong{display:block;font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cob__quem:hover strong{text-decoration:underline;text-underline-offset:3px}
.cob small{display:block;font-size:14px;color:var(--tinta-2)}
.cob--atraso .cob__venc small,.cob--atraso .cob__valor small{color:var(--atraso);font-weight:600}
.cob__valor{font-weight:700;font-size:19px;text-align:right}
.cob__acoes{display:flex;gap:6px}

.vazio{background:var(--folha-2);border:1px dashed rgba(255,255,255,.26);border-radius:14px;padding:28px 20px;text-align:center;color:var(--tinta-2)}
.vazio strong{display:block;color:var(--tinta);font-size:18px;margin-bottom:4px}
.vazio .bt{margin-top:14px}
.conteudo>.nota{display:inline-block;background:var(--folha-2);border-radius:10px;padding:8px 12px}

/* clientes */
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.busca{flex:1 1 240px;min-width:0}
.campo,.busca{min-height:42px;padding:8px 12px;border:1px solid rgba(255,255,255,.18);border-radius:10px;background:rgba(0,0,0,.42);width:100%}
.campo::placeholder,.busca::placeholder{color:rgba(243,251,246,.45)}
textarea.campo{min-height:88px;resize:vertical}
.chip{
  min-height:34px;padding:4px 13px;border-radius:17px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.42);
  font-size:14px;font-weight:600;color:var(--tinta-2);
}
.chip[aria-pressed="true"]{background:var(--marca);border-color:var(--marca);color:var(--marca-tinta)}
.tabela{overflow:hidden}
.tb-rolagem{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font-size:14px;font-weight:600;color:var(--tinta-2);text-align:left;padding:11px 16px;border-bottom:1px solid var(--linha);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--linha);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.n,td.n{text-align:right}
tbody tr[data-acao]{cursor:pointer}
tbody tr[data-acao]:hover{background:var(--realce)}
tr.l--atraso{background:var(--atraso-fundo);box-shadow:inset 6px 0 0 var(--alarme)}
tr.l--hoje{background:var(--hoje-fundo);box-shadow:inset 6px 0 0 var(--hoje)}
tr.l--atual{background:var(--realce);box-shadow:inset 4px 0 0 var(--ouro)}
td .nome{font-weight:700;white-space:nowrap}
td small{display:block;color:var(--tinta-2);font-size:14px}
td.neg{color:var(--atraso)} td.pos{color:var(--pago)}
.sit{display:inline-block;padding:2px 10px;border-radius:12px;font-size:14px;font-weight:700;white-space:nowrap;background:var(--realce)}
.sit--atraso{background:var(--alarme);color:#fff}
.sit--hoje{background:var(--hoje-fundo);color:var(--hoje);box-shadow:inset 0 0 0 1px var(--hoje)}
.sit--emdia{background:var(--pago-fundo);color:var(--pago)}
.sit--quitado{color:var(--tinta-2)}

/* ficha do cliente */
.voltar{background:none;border:0;padding:0;margin-bottom:10px;color:var(--tinta-2);font-weight:600}
.voltar:hover{color:var(--tinta)}
.ficha{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;margin-bottom:30px}
.cartao{padding:20px}
.cartao>h2{font-size:20px;font-weight:600;letter-spacing:-.02em;margin-bottom:12px}
.dados{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
.dados dt{color:var(--tinta-2)}
.dados dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.doc{position:relative}
.doc__ver{display:block;width:100%;padding:0;border:1px solid var(--linha);border-radius:10px;overflow:hidden;background:var(--realce)}
.doc__ver img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.doc__tipo{display:block;font-size:13px;font-weight:700;margin-top:4px}
.doc__x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:13px;border:0;background:rgba(0,0,0,.75);color:#fff;font-size:16px;line-height:1}
.doc__esp{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;font-size:13px;color:var(--tinta-2)}
.envio{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.envio select{flex:0 1 150px;width:auto}
.nota{font-size:14px;color:var(--tinta-2)}
.alerta{font-size:14px;color:var(--atraso);font-weight:600}

/* empréstimo + carnê */
.emp{background:var(--folha-2);border:1px solid var(--linha);border-radius:14px;padding:18px;margin-bottom:14px}
.emp__cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px 20px;margin-bottom:12px}
.emp__valores{font-weight:700;font-size:clamp(21px,2.8vw,28px);line-height:1.1;letter-spacing:-.025em}
.emp__valores span{color:var(--tinta-2);font-weight:500;padding:0 .35em}
.barra{height:5px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden;margin:8px 0 14px}
.barra i{display:block;height:100%;background:var(--marca)}
.carne{display:grid;grid-template-columns:repeat(auto-fill,minmax(204px,1fr));gap:12px}
.canhoto{
  position:relative;background:rgba(255,255,255,.05);border:1px solid var(--linha);border-left:2px dashed rgba(255,255,255,.4);
  border-radius:4px 12px 12px 4px;padding:10px 12px 10px 16px;display:flex;flex-direction:column;gap:2px;
}
.canhoto--atraso{background:var(--atraso-fundo);border-color:var(--atraso)}
.canhoto--hoje{background:var(--hoje-fundo);border-color:var(--hoje)}
.canhoto--pago{background:var(--pago-fundo)}
.canhoto__n{font-size:13px;color:var(--tinta-2);font-weight:600}
.canhoto__valor{font-weight:700;font-size:20px;line-height:1.2}
.canhoto__venc{font-size:14px}
.canhoto--atraso .canhoto__venc{color:var(--atraso);font-weight:700}
.canhoto__acoes{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:10px}
.canhoto__acoes .bt{flex:1 1 auto;padding-inline:8px}
.carimbo{
  position:absolute;right:8px;top:9px;transform:rotate(-11deg);border:2px solid var(--pago);color:var(--pago);
  font-weight:800;font-size:13px;letter-spacing:.12em;padding:0 6px;border-radius:3px;opacity:.9;
}

/* caixa */
.grafico-caixa{padding:18px 18px 12px;margin-bottom:16px;overflow-x:auto}
.grafico{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(44px,1fr);gap:6px;height:190px;min-width:560px}
.g-col{display:flex;flex-direction:column;gap:6px;min-width:0;border-radius:6px;padding:4px 2px 2px}
.g-col--atual{background:var(--realce)}
.g-barras{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px;border-bottom:1px solid var(--linha)}
.g-barras i{display:block;width:26%;max-width:16px;border-radius:2px 2px 0 0}
.b-saiu{background:#F3FBF6}
.b-entrou{background:var(--marca)}
.b-prev{border:1.5px dashed var(--tinta-2);border-bottom:0}
.b-venc{border:1.5px dashed var(--atraso);border-bottom:0;background:var(--atraso-fundo)}
.g-rot{font-size:12px;color:var(--tinta-2);text-align:center;white-space:nowrap}
.legenda{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:14px;color:var(--tinta-2)}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:6px}

/* modal */
.veu{
  position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.66);display:flex;align-items:flex-start;justify-content:center;
  padding:max(24px,env(safe-area-inset-top,0px)) 14px 24px;overflow-y:auto;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.janela{
  width:100%;max-width:560px;background:var(--solido);border:1px solid rgba(255,255,255,.18);border-radius:18px;
  padding:24px;box-shadow:0 30px 80px -20px #000;margin:auto 0;
}
.janela--larga{max-width:680px}
.janela h2{font-weight:600;font-size:26px;line-height:1.1;letter-spacing:-.03em;margin-bottom:16px}
.rot{display:block;font-size:14px;font-weight:600;margin-bottom:12px}
.rot>.campo,.rot>.rs,.rot>select{margin-top:4px;font-weight:400;font-size:16px}
.par{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rs{display:flex;align-items:center;border:1px solid rgba(255,255,255,.18);border-radius:10px;background:rgba(0,0,0,.42);padding-left:12px}
.rs span{color:var(--tinta-2);font-weight:600}
.rs input{border:0;background:none;min-height:40px;padding:8px 12px 8px 6px;width:100%;min-width:0;font-weight:700;font-size:18px}
.rs:focus-within{outline:2px solid var(--marca);outline-offset:2px}
.rs input:focus{outline:0}
.seg{display:flex;border:1px solid rgba(255,255,255,.2);border-radius:999px;overflow:hidden;margin-top:4px;background:rgba(0,0,0,.42)}
.seg label{flex:1;text-align:center;padding:9px 8px;font-weight:600;cursor:pointer;font-size:15px;white-space:nowrap}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--marca);color:var(--marca-tinta)}
.seg label:has(input:focus-visible){outline:2px solid var(--marca);outline-offset:-2px}
.seg--auto{display:inline-flex;margin-top:0}
.seg--auto label{flex:none;padding-inline:16px}
.previa{border:1px solid var(--linha);border-radius:10px;margin:4px 0 12px;max-height:260px;overflow-y:auto}
.previa__l{display:grid;grid-template-columns:54px 1fr 1fr;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--linha)}
.previa__l:last-child{border-bottom:0}
.previa__l b{font-size:14px;color:var(--tinta-2)}
.previa__l .campo,.previa__l .rs{min-height:36px;padding-block:4px}
.previa__l .rs input{min-height:28px;font-size:16px;padding-block:2px}
.rodape{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:18px}
.rodape .esq{margin-right:auto}
.luz{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:16px}
.luz img{max-width:100%;max-height:100%;border-radius:8px}
.luz button{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:14px}

#toast{
  position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:70;
  background:#F3FBF6;color:#03170B;padding:10px 18px;border-radius:999px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:calc(100vw - 32px);
}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* telas de acesso */
#app.fora{display:block}
.portal{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:32px 16px}
.portal__cx{width:100%;max-width:420px;padding:26px;display:flex;flex-direction:column;gap:12px}
.portal__cx h1{font-weight:600;font-size:30px;line-height:1.05;letter-spacing:-.035em}
.portal__cx .rot{margin-bottom:0}
.sql{background:rgba(0,0,0,.5);border:1px solid var(--linha);border-radius:10px;padding:12px;font-size:13px;overflow-x:auto;white-space:pre;margin:0;user-select:all}
.sair{background:none;border:0;padding:4px 0;color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}

@media (max-width:860px){
  #app{display:block}
  .trilho{position:static;height:auto;padding:12px 16px;border-right:0;border-bottom:1px solid var(--linha)}
  .trilho .nav,.trilho .pe{display:none}
  .trilho .logo{max-width:150px}
  .conteudo{padding:22px 14px calc(96px + env(safe-area-inset-bottom,0px))}
  .abas{
    display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
    border-top:1px solid var(--linha);padding-bottom:env(safe-area-inset-bottom,0px);transition:transform .3s;
  }
  :root[data-intro] .abas{transform:translateY(110%)}
  .abas button{display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;background:none;border:0;padding:13px 2px;font-weight:600;color:var(--tinta-2);font-size:13px}
  .abas button[aria-current="page"]{color:var(--ouro);box-shadow:inset 0 2px 0 var(--ouro)}
  .abas .conta{min-width:20px;line-height:20px;font-size:12px}
  .razao{grid-template-columns:1fr 1fr}
  .razao div:nth-child(3){border-left:0}
  .razao div:nth-child(n+3){border-top:1px solid var(--linha)}
  .cob{grid-template-columns:minmax(0,1fr) auto}
  .cob__acoes{grid-column:1/-1}
  .cob__acoes .bt{flex:1}
  .cob__venc{grid-row:2;grid-column:1}
  .cob__valor{grid-row:1;grid-column:2}
  .ficha{grid-template-columns:1fr}
  .par{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .descer{opacity:1}
}

</section>

<div id="modal"></div>

/* ---------- caixa: contabilidade geral por semana ou mês ---------- */
function chaveP(d, modo){
  if (modo === "mes") return String(d).slice(0, 7) + "-01";
  const x = parseISO(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return iso(x);
}
function rotP(k, modo, curto){
  if (modo === "mes") {
    const d = parseISO(k);
    return curto ? d.toLocaleDateString("pt-BR", { month: "short" }).replace(".", "") + "/" + String(d.getFullYear()).slice(2)
                 : d.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
  }
  const fim = parseISO(k); fim.setDate(fim.getDate() + 6);
  return curto ? fmtData(k).slice(0, 5) : fmtData(k).slice(0, 5) + " a " + fmtData(iso(fim)).slice(0, 5);
}
function vCaixa(hoje){
  const modo = S.caixaModo, freq = modo === "mes" ? "mensal" : "semanal";
  const atual = chaveP(hoje, modo);
  const chaves = []; for (let k = -6; k <= 5; k++) chaves.push(addPeriodo(atual, freq, k + S.caixaDesloc));
  const m = new Map(chaves.map(k => [k, { saiu: 0, entrou: 0, aberto: 0 }]));
  for (const e of S.emprestimos.values()) {
    const a = m.get(chaveP(dataEmp(e), modo)); if (a) a.saiu += e.valorEmprestado || 0;
    for (const p of e.parcelas || []) {
      if (p.pago) { const b = m.get(chaveP(p.pagoEm || p.venc, modo)); if (b) b.entrou += recebidoDe(p); }
      else { const b = m.get(chaveP(p.venc, modo)); if (b) b.aberto += p.valor; }
    }
  }
  const t = totais(hoje);
  const inad = t.vencido ? t.atrasado / t.vencido * 100 : 0;
  const giro = t.emprestado ? t.recebido / t.emprestado * 100 : 0;
  const pc = n => n.toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + "%";
  const seg = (v, rot) => '<label><input type="radio" name="cx-modo" value="' + v + '"' + (modo === v ? " checked" : "") + ">" + rot + "</label>";
  let h = '<header class="topo"><div><h1>Caixa</h1><p class="sub">Contabilidade geral de todos os clientes</p></div>' +
    '<div class="grupo-botoes"><div class="seg seg--auto">' + seg("semana", "Por semana") + seg("mes", "Por mês") + "</div></div></header>";
  h += '<dl class="razao">' +
    "<div><dt>Capital na rua</dt><dd>" + brl(t.capitalRua) + "<small>de " + brl(t.emprestado) + " emprestados</small></dd></div>" +
    '<div class="recebido"><dt>Ganho já recebido</dt><dd>' + brl(t.lucroRecebido) + "<small>" + brl(t.recebido) + " recebidos no total</small></dd></div>" +
    "<div><dt>Ganho a receber</dt><dd>" + brl(t.lucroAReceber) + "<small>" + brl(t.aberto) + " em aberto</small></dd></div>" +
    '<div class="' + (t.atrasado ? "em-atraso" : "") + '"><dt>Inadimplência</dt><dd>' + pc(inad) + "<small>" + brl(t.atrasado) + " vencidos sem pagamento</small></dd></div></dl>";
  if (!S.emprestimos.size) return h + '<div class="vazio"><strong>Nenhum empréstimo lançado</strong>O fluxo por semana e por mês aparece aqui assim que houver empréstimos e pagamentos.</div>';
  const max = Math.max(1, ...chaves.map(k => { const a = m.get(k); return Math.max(a.saiu, a.entrou, a.aberto); }));
  const barra = (cls, v, rot) => v ? '<i class="' + cls + '" style="height:' + Math.max(3, Math.round(v / max * 100)) + '%" title="' + rot + ": " + brl(v) + '"></i>' : '<i style="height:0"></i>';
  h += '<div class="grafico-caixa"><div class="grafico" role="img" aria-label="Emprestado, recebido e a receber por período. Os valores estão na tabela abaixo.">' +
    chaves.map(k => { const a = m.get(k);
      return '<div class="g-col' + (k === atual ? " g-col--atual" : "") + '"><div class="g-barras">' +
        barra("b-saiu", a.saiu, "Emprestado") + barra("b-entrou", a.entrou, "Recebido") + barra(k < atual ? "b-venc" : "b-prev", a.aberto, "Em aberto") +
        '</div><span class="g-rot">' + esc(rotP(k, modo, true)) + "</span></div>"; }).join("") + "</div>" +
    '<div class="legenda"><span><i class="b-saiu"></i>Emprestado</span><span><i class="b-entrou"></i>Recebido</span><span><i class="b-prev"></i>A receber</span><span><i class="b-venc"></i>Vencido sem pagamento</span></div></div>';
  h += '<div class="filtros"><button class="bt bt--p" data-acao="caixa-desloc" data-d="-6">Períodos anteriores</button>' +
    (S.caixaDesloc ? '<button class="bt bt--p" data-acao="caixa-desloc" data-d="0">Voltar para hoje</button>' : "") +
    '<button class="bt bt--p" data-acao="caixa-desloc" data-d="6">Períodos seguintes</button></div>';
  h += '<div class="tabela"><div class="tb-rolagem"><table><thead><tr><th>' + (modo === "mes" ? "Mês" : "Semana") + '</th><th class="n">Emprestado</th><th class="n">Recebido</th><th class="n">Saldo do período</th><th class="n">Em aberto com vencimento no período</th></tr></thead><tbody>';
  let ts = 0, te = 0, ta = 0;
  h += chaves.map(k => { const a = m.get(k), sal = a.entrou - a.saiu; ts += a.saiu; te += a.entrou; ta += a.aberto;
    return '<tr class="' + (k === atual ? "l--atual" : "") + '"><td><span class="nome">' + esc(rotP(k, modo, false)) + "</span>" + (k === atual ? "<small>período atual</small>" : "") + "</td>" +
      '<td class="n">' + (a.saiu ? brl(a.saiu) : "") + '</td><td class="n">' + (a.entrou ? brl(a.entrou) : "") + "</td>" +
      '<td class="n ' + (sal < 0 ? "neg" : sal > 0 ? "pos" : "") + '">' + (a.saiu || a.entrou ? brl(sal) : "") + "</td>" +
      '<td class="n ' + (k < atual && a.aberto ? "neg" : "") + '">' + (a.aberto ? brl(a.aberto) + (k < atual ? "<small>vencido</small>" : "") : "") + "</td></tr>"; }).join("");
  h += '<tr><td><span class="nome">Total dos 12 períodos</span></td><td class="n"><strong>' + brl(ts) + '</strong></td><td class="n"><strong>' + brl(te) + '</strong></td><td class="n ' + (te - ts < 0 ? "neg" : "pos") + '"><strong>' + brl(te - ts) + '</strong></td><td class="n"><strong>' + brl(ta) + "</strong></td></tr>";
  h += "</tbody></table></div></div>";
  h += '<p class="nota" style="margin-top:12px">Giro do capital: ' + pc(giro) + " do que foi emprestado já voltou. O empréstimo entra na data em que saiu e cada recebimento entra na data do pagamento. Cada parcela é dividida entre capital e ganho na proporção do empréstimo; juros de atraso recebidos contam como ganho.</p>";
  return h;
}

function freqSel(){ const r = $('input[name="e-freq"]:checked'); return r ? r.value : "semanal"; }
function gerarPrevia(){
  const box = $("#e-prev"); if (!box) return;
  const tot = centavos($("#e-ret").value);
  const n = Math.max(1, Math.min(120, parseInt($("#e-n").value, 10) || 1));
  const ini = $("#e-ini").value || hojeISO(), freq = freqSel();
  const base = Math.floor(tot / n);
  let h = "";
  for (let i = 0; i < n; i++) {
    const v = i === n - 1 ? tot - base * (n - 1) : base;
    h += '<div class="previa__l"><b>' + (i + 1) + " de " + n + '</b><input class="campo pv-venc" type="date" value="' + addPeriodo(ini, freq, i) + '" aria-label="Vencimento da parcela ' + (i + 1) + '">' +
      '<div class="rs"><span>R$</span><input class="pv-val" inputmode="numeric" data-mask="moeda" value="' + num(v) + '" aria-label="Valor da parcela ' + (i + 1) + '"></div></div>';
  }
  box.innerHTML = h;
  atualizarSoma();
}
function atualizarSoma(){
  const val = centavos($("#e-val").value), ret = centavos($("#e-ret").value);
  const lucro = $("#e-lucro");
  if (val && ret) {
    const dif = ret - val;
    lucro.textContent = (dif >= 0 ? "Ganho de " : "Diferença de ") + brl(dif) + " (" + (dif / val * 100).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + "% sobre o emprestado).";
  } else lucro.textContent = "";
  const soma = $$(".pv-val").reduce((s, el) => s + centavos(el.value), 0);
  const el = $("#e-soma");
  if (ret && soma !== ret) { el.className = "alerta"; el.textContent = "As parcelas somam " + brl(soma) + ". Esse passa a ser o valor a receber."; }
  else { el.className = "nota"; el.textContent = soma ? "Soma das parcelas: " + brl(soma) + "." : ""; }
}

const reais = v => Math.round(Number(v || 0) * 100);
const emReais = c => (c / 100).toFixed(2);
const urlsAssinadas = new Map();
const urlDoc = d => { const u = urlsAssinadas.get(d.caminho); return u ? u.url : ""; };

async function todos(tabela){
  let out = [], de = 0;
  for (;;) {
    const { data, error } = await sb.from(tabela).select("*").order("id").range(de, de + 999);
    if (error) throw error;
    out = out.concat(data || []);
    if (!data || data.length < 1000) return out;
    de += 1000;
  }
}
async function assinarDocs(clienteId){
  const c = S.clientes.get(clienteId); if (!c) return;
  const agora = Date.now();
  const faltam = (c.docs || []).map(d => d.caminho).filter(k => { const u = urlsAssinadas.get(k); return !u || u.exp - agora < 600000; });
  if (!faltam.length) return;
  const { data, error } = await sb.storage.from("documentos").createSignedUrls(faltam, 3600);
  if (error) return;
  (data || []).forEach((r, i) => { if (r && r.signedUrl) urlsAssinadas.set(faltam[i], { url: r.signedUrl, exp: agora + 3600000 }); });
}
async function carregar(){
  const [cl, em, pa, dc, cf] = await Promise.all([
    todos("clientes"), todos("emprestimos"), todos("parcelas"), todos("documentos"),
    sb.from("config").select("dados").eq("id", "geral").maybeSingle()
  ]);
  if (cf.error) throw cf.error;
  const docsPor = new Map();
  dc.sort((a, b) => String(a.criado_em).localeCompare(String(b.criado_em))).forEach(d => {
    if (!docsPor.has(d.cliente_id)) docsPor.set(d.cliente_id, []);
    docsPor.get(d.cliente_id).push({ id: d.id, tipo: d.tipo, caminho: d.caminho });
  });
  const parPor = new Map();
  pa.forEach(p => {
    if (!parPor.has(p.emprestimo_id)) parPor.set(p.emprestimo_id, []);
    parPor.get(p.emprestimo_id).push({
      id: p.id, numero: p.numero, valor: reais(p.valor), venc: p.vencimento, pago: !!p.pago,
      pagoEm: p.pago_em, valorPago: p.valor_pago == null ? null : reais(p.valor_pago), avisoEm: p.aviso_em
    });
  });
  parPor.forEach(l => l.sort((a, b) => a.numero - b.numero));
  S.clientes = new Map(cl.map(c => [c.id, { id: c.id, nome: c.nome, whatsapp: c.whatsapp, cpf: c.cpf, obs: c.obs || "", criadoEm: c.criado_em, docs: docsPor.get(c.id) || [] }]));
  S.emprestimos = new Map(em.map(e => [e.id, {
    id: e.id, clienteId: e.cliente_id, valorEmprestado: reais(e.valor_emprestado), data: e.data, frequencia: e.frequencia,
    obs: e.obs || "", criadoEm: e.criado_em, parcelas: parPor.get(e.id) || []
  }]));
  const v = Object.assign({}, PADRAO, cf.data && cf.data.dados ? cf.data.dados : {});
  v.multa = +v.multa || 0; v.jurosDia = +v.jurosDia || 0;
  ["msgLembrete", "msgHoje", "msgAtraso"].forEach(k => { v[k] = String(v[k] || "").replace(/GM Solu\u00e7\u00f5es/g, "Grupo Modesto"); });
  S.cfg = v;
  ultimaCarga = Date.now();
  if (S.vista === "cliente" && S.clienteId) await assinarDocs(S.clienteId);
}
async function recarregar(){
  try { await carregar(); } catch (e) { erroDb(e); }
  render();
}

async function comprimir(arq){
  try {
    const bmp = await createImageBitmap(arq, { imageOrientation: "from-image" });
    const k = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas");
    cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    return await new Promise(r => cv.toBlob(r, "image/jpeg", 0.85));
  } catch (_) { return null; }
}
function novoId(){
  return window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
}
async function enviarDocs(arquivos, tipo){
  const id = S.clienteId; if (!id) return;
  toast(arquivos.length === 1 ? "Enviando foto" : "Enviando " + arquivos.length + " fotos");
  let ok = 0;
  for (const arq of arquivos) {
    const blob = await comprimir(arq);
    if (!blob) { toast("Não foi possível ler esta imagem. Use JPG ou PNG."); continue; }
    const caminho = id + "/" + novoId() + ".jpg";
    const up = await sb.storage.from("documentos").upload(caminho, blob, { contentType: "image/jpeg", upsert: false });
    if (up.error) { console.error(up.error); toast("Não foi possível enviar a foto: " + (up.error.message || "erro no envio")); continue; }
    const ins = await sb.from("documentos").insert({ cliente_id: id, tipo, caminho });
    if (ins.error) { await sb.storage.from("documentos").remove([caminho]); erroDb(ins.error); continue; }
    ok++;
  }
  if (!ok) return;
  await recarregar();
  toast(ok === 1 ? "Foto anexada" : ok + " fotos anexadas");
}

function conectar(url, key){
  sb = window.supabase.createClient(url, key);
  sb.auth.onAuthStateChange(ev => {
    if (ev === "SIGNED_OUT") setTimeout(() => { usuario = null; S.clientes.clear(); S.emprestimos.clear(); S.fase = "login"; S.erro = ""; $("#modal").innerHTML = ""; render(); }, 0);
  });
}
async function entrar(){
  S.fase = "carregando"; render();
  const eq = await sb.from("equipe").select("user_id").eq("user_id", usuario.id).maybeSingle();
  if (eq.error) {
    console.error(eq.error);
    S.fase = "erro";
    S.erro = /PGRST205|42P01/.test(eq.error.code || "") || /schema cache|does not exist/i.test(eq.error.message || "")
      ? "As tabelas ainda não existem neste projeto. Rode o arquivo gm-solucoes-supabase.sql no SQL Editor do Supabase e recarregue a página."
      : "Não foi possível falar com o Supabase: " + (eq.error.message || "erro desconhecido") + ".";
    return render();
  }
  if (!eq.data) { S.fase = "bloqueado"; return render(); }
  try { await carregar(); S.fase = "app"; }
  catch (e) { console.error(e); S.fase = "erro"; S.erro = "Não foi possível carregar os dados: " + (e.message || "erro desconhecido") + "."; }
  render();
}

  S.erro = ""; usuario = data.user;

/* ---------- eventos ---------- */
document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-acao]"); if (!el) return;
  const a = el.dataset.acao, d = el.dataset;
  if (a === "veu") { if (ev.target === el) fecharModal(); return; }
  if (a === "login") return trava(el, fazerLogin);
  if (a === "salvar-config") return salvarConfig();
  if (a === "trocar-projeto") { try { localStorage.removeItem("gm_supabase"); } catch (_) {} location.reload(); return; }
  if (a === "recarregar-pagina") return location.reload();
  if (a === "sair") { if (sb) await sb.auth.signOut(); return; }
  if (S.fase !== "app") return;

  if (a === "enviou") {
    if (d.e) mudarParcela(d.e, parseInt(d.i, 10), p => { p.avisoEm = hojeISO(); }).then(() => carregar()).then(render).catch(() => {});
    return;
  }
  if (a === "nav") { S.vista = d.v; S.clienteId = null; render(); irTopo(); return; }
  if (a === "abrir-cliente") return abrirCliente(d.id);
  if (a === "ver-atrasados") { S.vista = "clientes"; S.filtro = "atraso"; S.busca = ""; render(); irTopo(); return; }
  if (a === "filtro") { S.filtro = d.f; render(); return; }
  if (a === "caixa-desloc") { const n = parseInt(d.d, 10); S.caixaDesloc = n ? S.caixaDesloc + n : 0; render(); return; }
  if (a === "fechar-modal") return fecharModal();
  if (a === "confirmar-sim") { const f = aoFechar; aoFechar = null; $("#modal").innerHTML = ""; if (f) f(true); return; }
  if (a === "fechar-luz") { const l = $(".luz"); if (l) l.remove(); return; }

  if (a === "novo-cliente") return modalCliente();
  if (a === "editar-cliente") return modalCliente(d.id);
  if (a === "salvar-cliente") return trava(el, () => salvarCliente(d.emp === "1"));
  if (a === "novo-emprestimo") return modalEmprestimo(d.cliente || "");
  if (a === "salvar-emprestimo") return trava(el, salvarEmprestimo);
  if (a === "pagar") return modalPagamento(d.e, parseInt(d.i, 10));
  if (a === "confirmar-pagamento") return trava(el, confirmarPagamento);
  if (a === "parcela") return modalParcela(d.e, parseInt(d.i, 10));
  if (a === "salvar-parcela") return trava(el, salvarParcela);
  if (a === "exportar") return exportar();

  if (a === "zap") {
    const e = S.emprestimos.get(d.e); if (!e) return;
    const i = parseInt(d.i, 10), c = S.clientes.get(e.clienteId); if (!c) return;
    return modalZap(c, mensagem({ e, c, p: e.parcelas[i], i }, hojeISO()), { e: d.e, i });
  }
  if (a === "zap-livre") { const c = S.clientes.get(d.id); if (c) modalZap(c, "Olá, " + primeiroNome(c.nome) + "! Aqui é da Grupo Modesto.", null); return; }
  if (a === "copiar-msg") {
    const t = $("#z-txt");
    try { await navigator.clipboard.writeText(t.value); toast("Texto copiado"); }
    catch (_) { t.select(); try { document.execCommand("copy"); toast("Texto copiado"); } catch (__) { toast("Selecione o texto e copie manualmente."); } }
    return;
  }
  if (a === "add-doc") { const f = $("#doc-arq"); if (f) f.click(); return; }
  if (a === "ver-doc") {
    if (!d.src) return;
    const div = document.createElement("div"); div.className = "luz"; div.dataset.acao = "fechar-luz";
    const img = document.createElement("img"); img.src = d.src; img.alt = "Documento ampliado";
    const b = document.createElement("button"); b.className = "bt"; b.dataset.acao = "fechar-luz"; b.textContent = "Fechar";
    div.append(img, b); document.body.append(div); b.focus(); return;
  }
  if (a === "excluir-doc") {
    const c = S.clientes.get(d.id), doc = c && (c.docs || []).find(x => x.id === d.doc); if (!doc) return;
    if (!(await confirmar("Excluir esta foto?", "A foto do documento será apagada de vez.", "Excluir foto"))) return;
    try {
      const { error } = await sb.from("documentos").delete().eq("id", doc.id);
      if (error) throw error;
      await sb.storage.from("documentos").remove([doc.caminho]);
      await recarregar(); toast("Foto excluída");
    } catch (e) { erroDb(e); }
    return;
  }
  if (a === "excluir-emprestimo") {
    if (!(await confirmar("Excluir este empréstimo?", "Todas as parcelas e pagamentos registrados nele serão apagados.", "Excluir empréstimo"))) return;
    try {
      const { error } = await sb.from("emprestimos").delete().eq("id", d.e);
      if (error) throw error;
      await recarregar(); toast("Empréstimo excluído");
    } catch (e) { erroDb(e); }
    return;
  }
  if (a === "excluir-cliente") {
    const c = S.clientes.get(d.id); if (!c) return;
    const emps = emprestimosDe(d.id);
    if (!(await confirmar("Excluir " + c.nome + "?", "O cadastro, as fotos dos documentos e " + (emps.length ? emps.length + (emps.length === 1 ? " empréstimo" : " empréstimos") : "todos os dados") + " deste cliente serão apagados de vez.", "Excluir cliente"))) return;
    try {
      const caminhos = (c.docs || []).map(x => x.caminho);
      const { error } = await sb.from("clientes").delete().eq("id", d.id);
      if (error) throw error;
      if (caminhos.length) await sb.storage.from("documentos").remove(caminhos);
      S.vista = "clientes"; S.clienteId = null; await recarregar(); toast("Cliente excluído");
    } catch (e) { erroDb(e); }
    return;
  }
  if (a === "salvar-cfg" || a === "restaurar-cfg") {
    const fixos = { pix: $("#cfg-pix").value.trim(), multa: taxa($("#cfg-multa").value), jurosDia: taxa($("#cfg-juros").value) };
    const novo = a === "restaurar-cfg"
      ? Object.assign({}, PADRAO, fixos)
      : Object.assign({ msgLembrete: $("#cfg-lembrete").value.trim(), msgHoje: $("#cfg-hoje").value.trim(), msgAtraso: $("#cfg-atraso").value.trim() }, fixos);
    try {
      const { error } = await sb.from("config").upsert({ id: "geral", dados: novo });
      if (error) throw error;
      S.cfg = novo; render(); toast("Ajustes salvos");
    } catch (e) { erroDb(e); }
    return;
  }
});

document.addEventListener("input", ev => {
  const el = ev.target, m = el.dataset && el.dataset.mask;
  if (m === "moeda") el.value = num(centavos(el.value));
  else if (m === "cpf") {
    el.value = fmtCPF(el.value);
    const av = $("#c-aviso");
    if (av) { const d = soDig(el.value); av.hidden = !(d.length === 11 && !cpfValido(d)); av.textContent = "Os dígitos deste CPF não conferem. Revise antes de salvar."; }
  }
  else if (m === "fone") el.value = fmtFone(el.value);
  if (el.id === "busca") { S.busca = el.value; render(); return; }
  if (el.id === "e-ini") iniTocado = true;
  if (el.id === "g-val") pagValTocado = true;
  if (el.id === "e-ret" || el.id === "e-n" || el.id === "e-ini") return gerarPrevia();
  if (el.id === "e-val" || el.classList.contains("pv-val")) return atualizarSoma();
  if (el.id === "z-txt") { const l = $("#z-link"); if (l) l.href = "https://wa.me/" + el.dataset.fone + "?text=" + encodeURIComponent(el.value); }
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.name === "e-freq") {
    if (!iniTocado) $("#e-ini").value = addPeriodo($("#e-data").value || hojeISO(), el.value, 1);
    return gerarPrevia();
  }
  if (el.id === "e-data" && !iniTocado && el.value) { $("#e-ini").value = addPeriodo(el.value, freqSel(), 1); return gerarPrevia(); }
  if (el.name === "cx-modo") { S.caixaModo = el.value; S.caixaDesloc = 0; return render(); }
  if (el.id === "g-data" && el.value) {
    const e = S.emprestimos.get($("#g-e").value); if (!e) return;
    const at = atualizado(e.parcelas[parseInt($("#g-i").value, 10)], el.value);
    const j = $("#g-juros"); j.hidden = !at.dias; j.textContent = textoJuros(at);
    if (!pagValTocado) $("#g-val").value = num(at.total);
    return;
  }
  if (el.id === "doc-arq" && el.files && el.files.length) {
    const arquivos = Array.from(el.files), tipo = ($("#doc-tipo") || {}).value || "Outro";
    el.value = "";
    enviarDocs(arquivos, tipo);
  }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") { const l = $(".luz"); if (l) return l.remove(); if ($("#modal").firstChild) fecharModal(); }
  if (ev.key === "Enter" && ev.target.matches) {
    if (ev.target.matches("tr[data-acao]")) ev.target.click();
    if (ev.target.matches("#l-email, #l-senha")) { const b = $('[data-acao="login"]'); if (b) b.click(); }
    if (ev.target.matches("#k-url, #k-key")) salvarConfig();
  }
});

/* ---------- início ---------- */
const livre = () => S.fase === "app" && !$("#modal").firstChild && S.vista !== "ajustes";
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && livre() && Date.now() - ultimaCarga > 30000) recarregar();
});
let dia = hojeISO();
setInterval(() => {
  const h = hojeISO();
  if (h !== dia) { dia = h; if (livre()) render(); }
  else if (!document.hidden && livre() && Date.now() - ultimaCarga > 300000) recarregar();
}, 60000);

render();
(async function iniciar(){
  if (!window.supabase || !window.supabase.createClient) {
    S.fase = "erro"; S.erro = "Não foi possível carregar a biblioteca do Supabase. Verifique a internet e recarregue a página."; return render();
  }
  let url = SUPABASE_URL, key = SUPABASE_ANON_KEY;
  if (!url || !key) {
    try { const g = JSON.parse(localStorage.getItem("gm_supabase") || "null"); if (g && g.url && g.key) { url = g.url; key = g.key; configLocal = true; } } catch (_) {}
  }
  if (!url || !key) { S.fase = "config"; return render(); }
  conectar(url, key);
  try {
    const { data } = await sb.auth.getSession();
    if (data && data.session) { usuario = data.session.user; return entrar(); }
  } catch (e) { console.error(e); }
  S.fase = "login"; render();
})();
})();
</script>
</body>
</html>
